name: Proyecto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend-requirements.lock
      - run: python -m pip install -e services/resource-api -e services/mission-api --no-deps
      - run: python scripts/test_backend.py
      - run: python scripts/verify_snapshots.py
      - run: python scripts/verify_backend.py --scenario all
      - run: python -m unittest discover -s scripts/tests -v
        working-directory: .
      - run: python scripts/export_contracts.py
      - run: git diff --exit-code -- docs/mission-api-openapi.json sdk/typescript/schema.ts
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test sdk/typescript/tests/client.test.ts
      - run: npm ci --ignore-scripts
        working-directory: API/integrations/nextjs
      - run: npm run typecheck && npm test
        working-directory: API/integrations/nextjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend-requirements.lock
      - run: python -m pip install -e services/resource-api -e services/mission-api --no-deps
      - run: python scripts/verify_backend.py --nextjs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check:contracts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r API/backend-requirements.lock
      - run: python -m pip install -e API/services/resource-api -e API/services/mission-api --no-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-navegador
          path: |
            playwright-report/
            test-results/
  launcher-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RockieOS entrega
    steps:
      - uses: actions/checkout@v4
        with:
          path: RockieOS entrega
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: .\RockieOS.cmd prepare
      - run: .\RockieOS.cmd test --quick
      - run: .\RockieOS.cmd present --smoke --no-browser
      # También debe reutilizar la compilación, sin procesos ni puertos abandonados.
      - run: .\RockieOS.cmd present --smoke --no-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-lanzador-windows
          path: RockieOS entrega/reports/rockieos/

