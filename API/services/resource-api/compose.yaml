services:
  resources:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - resource-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  resource-data:
