[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita-resource-api"
version = "0.1.0"
description = "Integración de recursos científicos NASA para el motor de Órbita"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx[socks]==0.28.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resource_api = ["snapshots/*.json"]
